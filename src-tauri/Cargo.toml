[package]
name = "app"
version = "0.1.4"
description = "JM Comic Desktop Client"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
semver = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls", "socks", "cookies"], default-features = false }

# JM protocol: md5 tokens, AES-256-ECB response decryption
md-5 = "0.10"
aes = "0.8"
cipher = "0.4"
sha2 = "0.10"
hex = "0.4"

# Image descrambling / re-encoding
image = { version = "0.25.5", default-features = false, features = ["jpeg", "png", "webp"] }
rayon = "1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono"] }

# Utils
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
urlencoding = "2"
base64 = "0.22"
futures = "0.3"
anyhow = "1"
thiserror = "2"
